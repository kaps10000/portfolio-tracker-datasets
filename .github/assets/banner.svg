<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="portfolio-tracker-datasets">
  <title>portfolio-tracker-datasets</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06201b"><animate attributeName="stop-color" values="#06201b;#0b2f29;#06201b" dur="10s" repeatCount="indefinite"/></stop>
      <stop offset="0.55" stop-color="#0b2f29"/>
      <stop offset="1" stop-color="#0a1f2e"><animate attributeName="stop-color" values="#0a1f2e;#06201b;#0a1f2e" dur="10s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399" stop-opacity="0"/><stop offset="0.5" stop-color="#34d399" stop-opacity="0.22"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <clipPath id="type"><rect x="60" y="160" width="0" height="44"><animate attributeName="width" values="0;1100;1100" keyTimes="0;0.45;1" dur="7s" repeatCount="indefinite"/></rect></clipPath>
    <style>
      .f1 { animation: drift 9s ease-in-out infinite; }
      .f2 { animation: drift 12s ease-in-out infinite reverse; }
      .f3 { animation: drift 15s ease-in-out infinite; }
      @keyframes drift { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-24px,18px); } }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <g opacity="0.55">
    <circle class="f1" cx="1010" cy="90" r="70" fill="none" stroke="#34d399" stroke-opacity="0.35" stroke-width="2"/>
    <circle class="f2" cx="1100" cy="230" r="38" fill="#fbbf24" fill-opacity="0.18"/>
    <rect class="f3" x="880" y="180" width="64" height="64" rx="12" fill="none" stroke="#fbbf24" stroke-opacity="0.4" stroke-width="2" transform="rotate(18 912 212)"/>
    <circle class="f2" cx="940" cy="60" r="6" fill="#34d399" fill-opacity="0.7"/>
    <circle class="f1" cx="1150" cy="140" r="4" fill="#fbbf24" fill-opacity="0.8"/>
  </g>
  <rect x="-300" y="0" width="300" height="320" fill="url(#scan)">
    <animate attributeName="x" values="-300;1200" dur="6s" repeatCount="indefinite"/>
  </rect>
  <text x="60" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" fill="#34d399" fill-opacity="0.9">archive_6.zip -&gt; FINAL_USO.csv</text>
  <text x="60" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="54" font-weight="800" fill="#ecfdf5">portfolio-tracker-datasets</text>
  <rect x="60" y="150" width="120" height="4" rx="2" fill="url(#accent)"/>
  <g clip-path="url(#type)">
    <text x="60" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#b7e4d3">Daily market data, 2011-12-15 to 2018-12-31: 1,718 rows x 81 columns.</text>
  </g>
  <g transform="translate(60,234)"><rect width="50" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#34d399" stroke-opacity="0.7"/><text x="25" y="22.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#ecfdf5">CSV</text></g><g transform="translate(122,234)"><rect width="123" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#34d399" stroke-opacity="0.7"/><text x="62" y="22.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#ecfdf5">ZIP archive</text></g><g transform="translate(257,234)"><rect width="114" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#34d399" stroke-opacity="0.7"/><text x="57" y="22.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#ecfdf5">81 columns</text></g><g transform="translate(383,234)"><rect width="188" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#34d399" stroke-opacity="0.7"/><text x="94" y="22.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#ecfdf5">1,718 trading days</text></g>
  <rect x="0" y="316" width="1200" height="4" fill="url(#accent)"/>
</svg>
