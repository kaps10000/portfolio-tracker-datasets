<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="12" viewBox="0 0 1200 12" role="img" aria-label="divider">
  <defs>
    <linearGradient id="d" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#34d399" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#34d399"><animate attributeName="offset" values="0.1;0.5;0.1" dur="6s" repeatCount="indefinite"/></stop>
      <stop offset="0.7" stop-color="#fbbf24"><animate attributeName="offset" values="0.5;0.9;0.5" dur="6s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="5" width="1200" height="2" rx="1" fill="url(#d)"/>
  <circle cx="0" cy="6" r="3" fill="#34d399"><animate attributeName="cx" values="0;1200" dur="6s" repeatCount="indefinite"/></circle>
</svg>
